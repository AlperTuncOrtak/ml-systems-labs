# Schema for UCI Adult (OpenML v2). Allowed categories from UCI adult.names.
missing_token: "?"        # '?' means missing; NaN is treated the same
columns:
  age: {type: int, range: [17, 90]}
  workclass:
    type: category
    allowed: [Private, Self-emp-not-inc, Self-emp-inc, Federal-gov, Local-gov,
              State-gov, Without-pay, Never-worked]
  fnlwgt: {type: int}
  education:
    type: category
    allowed: [Bachelors, Some-college, 11th, HS-grad, Prof-school, Assoc-acdm,
              Assoc-voc, 9th, 7th-8th, 12th, Masters, 1st-4th, 10th, Doctorate,
              5th-6th, Preschool]
  education-num: {type: int}
  marital-status:
    type: category
    allowed: [Married-civ-spouse, Divorced, Never-married, Separated, Widowed,
              Married-spouse-absent, Married-AF-spouse]
  occupation:
    type: category
    allowed: [Tech-support, Craft-repair, Other-service, Sales, Exec-managerial,
              Prof-specialty, Handlers-cleaners, Machine-op-inspct, Adm-clerical,
              Farming-fishing, Transport-moving, Priv-house-serv, Protective-serv,
              Armed-Forces]
  relationship:
    type: category
    allowed: [Wife, Own-child, Husband, Not-in-family, Other-relative, Unmarried]
  race:
    type: category
    allowed: [White, Asian-Pac-Islander, Amer-Indian-Eskimo, Other, Black]
  sex: {type: category, allowed: [Female, Male]}
  capital-gain: {type: int, range: [0, 99999]}
  capital-loss: {type: int, range: [0, 4356]}
  hours-per-week: {type: int, range: [1, 99]}
  native-country:
    type: category
    allowed: [United-States, Cambodia, England, Puerto-Rico, Canada, Germany,
              Outlying-US(Guam-USVI-etc), India, Japan, Greece, South, China, Cuba,
              Iran, Honduras, Philippines, Italy, Poland, Jamaica, Vietnam, Mexico,
              Portugal, Ireland, France, Dominican-Republic, Laos, Ecuador, Taiwan,
              Haiti, Columbia, Hungary, Guatemala, Nicaragua, Scotland, Thailand,
              Yugoslavia, El-Salvador, Trinadad&Tobago, Peru, Hong,
              Holand-Netherlands]
  class:                   # income label
    type: category
    allowed: ["<=50K", ">50K"]
# data dictionary: education level -> education-num
education_num:
  Preschool: 1
  1st-4th: 2
  5th-6th: 3
  7th-8th: 4
  9th: 5
  10th: 6
  11th: 7
  12th: 8
  HS-grad: 9
  Some-college: 10
  Assoc-voc: 11
  Assoc-acdm: 12
  Bachelors: 13
  Masters: 14
  Prof-school: 15
  Doctorate: 16
